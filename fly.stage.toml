app = "aquatrack-stage"

primary_region = "bom"

[build]
  dockerfile = "Dockerfile"

[env]
  APP_ENV = "stage"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = "2gb"
  cpu_kind = "shared"
  cpus = 1