[alembic]
# Path to migration scripts.
script_location = alembic

# The database URL for your project. This should match the one in your app.
sqlalchemy.url = sqlite:///./aqua_track.db

# Path to the file containing your SQLAlchemy models.
version_locations = %(here)s/alembic/versions

# File logging configuration.
file_logging_config = %(here)s/alembic/logging.ini
