[alembic]
# This points to the directory containing your env.py and versions folder,
# relative to where you run the 'alembic' command.
script_location = backend/alembic

# The logging configuration file, also relative to the command's location.
file_config = backend/migrations/logging.ini

# The database URL for your SQLite database.
sqlalchemy.url = sqlite:///aqua_track.db

# Do not change these. They are for auto-generating migrations.
sqlalchemy.echo = True
sqlalchemy.pool_recycle = 3600

[loggers]
keys = root, alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_alembic]
level = INFO
handlers = console
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
